name: Bug report
description: Report a reproducible problem in ChenLink.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ChenLink. Please remove secrets and private addresses before posting.
  - type: input
    id: version
    attributes:
      label: ChenLink version
      placeholder: V1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - EasyTier / no-public-IP mode
        - Legacy room and relay mode
        - TCP or UDP forwarding
        - User interface
        - Build or release
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact error message if one is shown.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, game, network type, and whether IPv6 is enabled.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove room codes, public IP addresses, and other private information first.
    validations:
      required: false
