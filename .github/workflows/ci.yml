name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChenLink.sln -p:Platform=x64

      - name: Build Release
        run: dotnet build ChenLink.sln -c Release -p:Platform=x64 --no-restore

      - name: Run self-test
        run: dotnet run --project src/ChenLinkServer/ChenLinkServer.csproj -c Release --no-build -- --selftest
